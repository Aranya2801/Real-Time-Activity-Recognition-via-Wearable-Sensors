[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wearhar"
version = "0.2.0"
description = "Subject-independent, real-time human activity recognition from smartphone/wearable IMU data"
authors = [{ name = "Aranya Ghosh" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
export = ["onnx>=1.15", "onnxruntime>=1.17"]
serve = ["fastapi>=0.110", "uvicorn>=0.27", "websockets>=12"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:torch.*", "ignore:You are using the legacy TorchScript"]
